name: macos-dmg

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Bundle arbor-worker sidecar
        run: bash scripts/bundle-worker.sh

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build DMG
        working-directory: desktop
        env:
          CI: true
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build --bundles dmg --config src-tauri/tauri.bundle.json

      - uses: actions/upload-artifact@v4
        with:
          name: arbor-macos-dmg
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
