name: macos-dmg

# PR and main pushes upload an arbor-macos-dmg artifact.
# Pushing a v* tag runs release-macos.yml, which builds the same DMG and publishes a GitHub Release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Bundle onefile worker (before benchmark)
        run: |
          set -euo pipefail
          ONEFILE_BENCH_DIR="$(mktemp -d)"
          echo "ONEFILE_BENCH_DIR=$ONEFILE_BENCH_DIR" >> "$GITHUB_ENV"
          ARBOR_WORKER_ONEFILE=1 bash scripts/bundle-worker.sh
          cp desktop/src-tauri/binaries/arbor-worker-* "$ONEFILE_BENCH_DIR/arbor-worker-onefile"

      - name: Bundle arbor-worker sidecar (onedir)
        run: bash scripts/bundle-worker.sh

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build DMG
        working-directory: desktop
        env:
          CI: true
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build --bundles dmg --config src-tauri/tauri.bundle.json

      - name: Smoke test DMG bundle
        run: bash scripts/smoke-macos-bundle.sh desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Benchmark worker startup (macOS)
        run: |
          set -euo pipefail
          DMG=(desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          MOUNT="$(mktemp -d "${TMPDIR:-/tmp}/arbor-dmg-bench.XXXXXX")"
          cleanup() { hdiutil detach "$MOUNT" -quiet 2>/dev/null || hdiutil detach "$MOUNT" -force -quiet 2>/dev/null || true; }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly "${DMG[0]}" -mountpoint "$MOUNT" >/dev/null
          APP=""
          for candidate in "$MOUNT"/*.app; do
            if [[ -d "$candidate" ]]; then
              APP="$candidate"
              break
            fi
          done
          WORKER="$APP/Contents/Resources/arbor-worker/arbor-worker"
          {
            echo "## onedir (after)"
            bash scripts/bench-worker.sh "$WORKER"
            echo ""
            echo "## onefile (before)"
            bash scripts/bench-worker.sh "$ONEFILE_BENCH_DIR/arbor-worker-onefile"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: arbor-macos-dmg
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
